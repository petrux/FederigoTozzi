name: Build LaTeX PDFs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up a full TeX Live environment and execute your custom build script
      - name: Run build script
        uses: xu-cheng/texlive-action@v3
        with:
          run: |
            chmod +x scripts/build.sh
            ./scripts/build.sh

      # 3. Upload the generated PDFs as downloadable workflow artifacts
      - name: Upload PDF Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-books-pdf
          path: build/*.pdf